name: Publicar

# DOIS agendamentos por hora, nao um. Medido na API do repo do motor biblico em
# 03/09/2026: com um unico `0 * * * *`, o GitHub entregou ~6 execucoes por DIA
# (nao 24), em intervalos de 2 a 7 horas. O agendador coalesce disparos quando a
# fila aperta, e o que se perde e publicacao. Execucao em hora nao devida sai
# antes de qualquer chamada a API - custa um minuto de runner e zero cota.
#
# Repo PUBLICO de proposito: minutos de Actions ilimitados. Com repo privado os
# 2.000 min/mes nao cobrem o render diario (ver RETOMAR.md).
on:
  schedule:
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "So decidir, sem renderizar nem publicar"
        type: boolean
        default: false
      rede:
        description: "youtube, instagram ou vazio (as duas)"
        default: ""
      forcar_tipo:
        description: "short, longo, cartao ou story"
        default: ""

concurrency:
  group: publicar-gta6
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt

      - name: Conferir arquivos essenciais
        # Nasce de um incidente do motor biblico (20/07/2026): um `git add -A`
        # propagou a exclusao de um arquivo essencial e o runner ficou mudo.
        # Melhor falhar aqui, em 1 segundo e com mensagem clara.
        run: |
          faltou=0
          for f in marca/fontes/Montserrat-Bold.ttf marca/fontes/BebasNeue-Regular.ttf \
                   marca/avatar-96.png marca/selo.png conteudo/cenas.json; do
            [ -s "$f" ] || { echo "FALTANDO: $f"; faltou=1; }
          done
          exit $faltou

      - name: Cache do material oficial
        uses: actions/cache@v4
        with:
          path: marca/oficial
          key: oficial-v1-${{ hashFiles('produzir/baixar_oficial.py') }}

      - name: Baixar material oficial (trailers + galeria)
        # `marca/oficial/` e gitignorado (432 MB de galeria + trailers): o repo
        # e publico e isso incharia o Git para sempre. Em cache quente nao baixa
        # nada. O "An Extended Look" tem RESTRICAO DE IDADE no YouTube e nao
        # baixa no runner (o yt-dlp exige cookies de conta logada) - por isso
        # este passo nao pode derrubar a publicacao.
        run: python produzir/baixar_oficial.py
        continue-on-error: true

      - name: Restaurar credenciais
        env:
          YT_CLIENT_SECRET_GTA: ${{ secrets.YT_CLIENT_SECRET_GTA }}
          YT_TOKEN_GTA: ${{ secrets.YT_TOKEN_GTA }}
        run: |
          if [ -n "$YT_CLIENT_SECRET_GTA" ] && [ -n "$YT_TOKEN_GTA" ]; then
            mkdir -p credenciais/gta
            printf '%s' "$YT_CLIENT_SECRET_GTA" > credenciais/gta/client_secret.json
            printf '%s' "$YT_TOKEN_GTA" > credenciais/gta/token.json
            chmod 600 credenciais/gta/*
            echo "credenciais do YouTube restauradas"
          else
            echo "sem secrets do YouTube; o canal sera pulado"
          fi

      - name: Pegar o estado mais recente
        # Execucao que ficou na fila pela trava de concorrencia faz checkout
        # ANTES de a anterior empurrar o estado. Sem este pull, ela trabalha com
        # dados velhos e republica o que ja saiu.
        run: git pull --rebase --autostash || true

      - name: Publicar o que esta devido
        env:
          IG_USER_ID_GTA: ${{ secrets.IG_USER_ID_GTA }}
          IG_TOKEN_GTA: ${{ secrets.IG_TOKEN_GTA }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=""
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ -n "${{ inputs.rede }}" ] && args="$args --rede ${{ inputs.rede }}"
          [ -n "${{ inputs.forcar_tipo }}" ] && args="$args --forcar-tipo ${{ inputs.forcar_tipo }}"
          python publicador/publicar.py $args

      - name: Guardar estado (memoria entre execucoes)
        if: always()
        run: |
          rm -rf credenciais
          alvos="publicador/state.json publicador/playlists.json publicacoes.md publicacoes-ig.md fila"
          if [ -n "$(git status --porcelain $alvos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $alvos
            git commit -m "Publica (auto)"
            git pull --rebase --autostash
            git push
          else
            echo "Nada publicado nesta execucao."
          fi
