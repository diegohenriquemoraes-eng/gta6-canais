name: Publicar

# DOIS agendamentos por hora, nao um. Medido na API do repo do motor biblico em
# 03/09/2026: com um unico `0 * * * *`, o GitHub entregou ~6 execucoes por DIA
# (nao 24), em intervalos de 2 a 7 horas. O agendador coalesce disparos quando a
# fila aperta, e o que se perde e publicacao. Execucao em hora nao devida sai
# antes de qualquer chamada a API - custa um minuto de runner e zero cota.
#
# Repo PUBLICO de proposito: minutos de Actions ilimitados. Com repo privado os
# 2.000 min/mes nao cobrem o render diario (ver RETOMAR.md).
on:
  schedule:
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "So decidir, sem renderizar nem publicar"
        type: boolean
        default: false
      rede:
        description: "youtube, instagram ou vazio (as duas)"
        default: ""
      forcar_tipo:
        description: "short, longo, cartao ou story"
        default: ""
      render_apenas:
        # Ensaio: renderiza no runner e NAO sobe nada. Custa minuto de runner
        # (ilimitado, repo publico) e ZERO cota da API. E como se descobre que
        # o longo estoura o teto do job antes de a hora dele chegar.
        description: "Renderiza e nao publica (nao gasta cota)"
        type: boolean
        default: false

concurrency:
  group: publicar-gta6
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt

      - name: Conferir arquivos essenciais
        # Nasce de um incidente do motor biblico (20/07/2026): um `git add -A`
        # propagou a exclusao de um arquivo essencial e o runner ficou mudo.
        # Melhor falhar aqui, em 1 segundo e com mensagem clara.
        run: |
          faltou=0
          for f in marca/fontes/Montserrat-Bold.ttf marca/fontes/BebasNeue-Regular.ttf \
                   marca/avatar-96.png marca/selo.png conteudo/cenas.json; do
            [ -s "$f" ] || { echo "FALTANDO: $f"; faltou=1; }
          done
          exit $faltou

      - name: Cache do material oficial
        uses: actions/cache@v4
        with:
          path: marca/oficial
          key: oficial-v1-${{ hashFiles('produzir/baixar_oficial.py') }}

      - name: Baixar material oficial (trailers + galeria)
        # `marca/oficial/` e gitignorado: o repo e publico e isso incharia o
        # Git para sempre. O runner NAO consegue baixar do YouTube (o yt-dlp
        # leva "Sign in to confirm you're not a bot" em IP de datacenter), e a
        # galeria nao sai por script. Por isso o script busca primeiro o acervo
        # empacotado no Release do repo de midia (110 MB, galeria ja reduzida a
        # 1080 px). Em cache quente nao baixa nada.
        run: python produzir/baixar_oficial.py
        continue-on-error: true

      - name: Conferir que ha material para o cartao
        # Sem arquivo local o Short cai no gradiente, mas o CARTAO do Instagram
        # FALHA (precisa do clipe/foto de verdade). Melhor saber aqui.
        run: |
          v=$(ls marca/oficial/*.mp4 2>/dev/null | wc -l)
          g=$(ls marca/oficial/galeria 2>/dev/null | wc -l)
          echo "material no runner: $v videos, $g imagens"

      - name: Restaurar credenciais
        env:
          YT_CLIENT_SECRET_GTA: ${{ secrets.YT_CLIENT_SECRET_GTA }}
          YT_TOKEN_GTA: ${{ secrets.YT_TOKEN_GTA }}
        run: |
          if [ -n "$YT_CLIENT_SECRET_GTA" ] && [ -n "$YT_TOKEN_GTA" ]; then
            mkdir -p credenciais/gta
            printf '%s' "$YT_CLIENT_SECRET_GTA" > credenciais/gta/client_secret.json
            printf '%s' "$YT_TOKEN_GTA" > credenciais/gta/token.json
            chmod 600 credenciais/gta/*
            echo "credenciais do YouTube restauradas"
          else
            echo "sem secrets do YouTube; o canal sera pulado"
          fi

      - name: Pegar o estado mais recente
        # Execucao que ficou na fila pela trava de concorrencia faz checkout
        # ANTES de a anterior empurrar o estado. Sem este pull, ela trabalha com
        # dados velhos e republica o que ja saiu.
        run: git pull --rebase --autostash || true

      - name: Publicar o que esta devido
        env:
          IG_USER_ID_GTA: ${{ secrets.IG_USER_ID_GTA }}
          IG_TOKEN_GTA: ${{ secrets.IG_TOKEN_GTA }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=""
          [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          [ -n "${{ inputs.rede }}" ] && args="$args --rede ${{ inputs.rede }}"
          [ -n "${{ inputs.forcar_tipo }}" ] && args="$args --forcar-tipo ${{ inputs.forcar_tipo }}"
          [ "${{ inputs.render_apenas }}" = "true" ] && args="$args --render-apenas"
          python publicador/publicar.py $args

      - name: Guardar estado (memoria entre execucoes)
        if: always()
        run: |
          rm -rf credenciais
          # Só os caminhos que EXISTEM: `git add` de um arquivo ausente falha
          # com exit 128 e derruba o passo — foi o que aconteceu no primeiro
          # Short publicado de verdade (23/09/2026): o vídeo subiu, mas o
          # estado não foi commitado porque `publicacoes-ig.md` ainda não
          # existia. Sem o estado salvo, a execução seguinte recontaria o dia.
          alvos=""
          for f in publicador/state.json publicador/playlists.json                    publicacoes.md publicacoes-ig.md fila; do
            [ -e "$f" ] && alvos="$alvos $f"
          done
          if [ -n "$alvos" ] && [ -n "$(git status --porcelain $alvos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $alvos
            git commit -m "Publica (auto)"
            git pull --rebase --autostash
            git push
          else
            echo "Nada publicado nesta execucao."
          fi
