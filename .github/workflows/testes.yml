name: Testes

# Todo push. A suite nao usa rede e roda em segundos: e a unica coisa que
# impede uma refatoracao de apagar uma regra que custou dias de alcance.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        # o teste do cartao valida o filtergraph contra o ffmpeg de verdade
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s testes -v
