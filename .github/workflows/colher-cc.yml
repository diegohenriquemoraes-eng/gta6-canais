name: Colher CC

# Gameplay com licenca Creative Commons para os formatos E e F. O script tem
# trava de data: antes de 19/11/2026 nao existe gameplay publico de GTA 6 que
# nao seja vazamento, e ele sai sem fazer nada.
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

jobs:
  colher:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - env:
          YT_CLIENT_SECRET_GTA: ${{ secrets.YT_CLIENT_SECRET_GTA }}
          YT_TOKEN_GTA: ${{ secrets.YT_TOKEN_GTA }}
        run: |
          if [ -z "$YT_TOKEN_GTA" ]; then echo "sem token; nada a fazer"; exit 0; fi
          mkdir -p credenciais/gta
          printf '%s' "$YT_CLIENT_SECRET_GTA" > credenciais/gta/client_secret.json
          printf '%s' "$YT_TOKEN_GTA" > credenciais/gta/token.json
          python produzir/colher_cc.py --quantos 4
          rm -rf credenciais
      - name: Guardar as cenas colhidas
        if: always()
        run: |
          # só os caminhos que EXISTEM: `git add` de arquivo ausente
          # devolve exit 128 e derruba o passo (ver publicar.yml)
          alvos=""
          for f in conteudo/cenas.json conteudo/cc_colhidos.json fontes/PROVENIENCIA.md; do
            [ -e "$f" ] && alvos="$alvos $f"
          done
          if [ -n "$alvos" ] && [ -n "$(git status --porcelain $alvos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $alvos
            git commit -m "Colhe gameplay CC BY (auto)"
            git pull --rebase --autostash
            git push
          fi
