name: Medir

# Diario as 07:40 UTC, depois da virada da cota. Aos domingos roda tambem o
# ranqueador contra a busca "gta 6" no YouTube e contra o NOSSO canal - e o
# "Vice Scrap" do ViceScale apontado para nos, que e onde ele de fato serve.
#
# O que este workflow NAO mede, e e o que decide a entrega do Short:
# "continuaram assistindo vs. pularam", que so existe no Studio.
on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurar credenciais
        env:
          YT_CLIENT_SECRET_GTA: ${{ secrets.YT_CLIENT_SECRET_GTA }}
          YT_TOKEN_GTA: ${{ secrets.YT_TOKEN_GTA }}
        run: |
          if [ -n "$YT_TOKEN_GTA" ]; then
            mkdir -p credenciais/gta
            printf '%s' "$YT_CLIENT_SECRET_GTA" > credenciais/gta/client_secret.json
            printf '%s' "$YT_TOKEN_GTA" > credenciais/gta/token.json
          fi
      - run: python produzir/medir_desempenho.py
      - name: Benchmark do nicho (domingos)
        if: always()
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            python produzir/ranquear_perfil.py --rede yt --consulta "gta 6" --top 50 || true
            python produzir/ranquear_perfil.py --rede yt --nosso --top 50 || true
          else
            echo "so aos domingos"
          fi
      - name: Guardar a medicao
        if: always()
        run: |
          rm -rf credenciais
          alvos="conteudo/desempenho_historico.json conteudo/benchmark.json benchmark/RESUMO.md"
          if [ -n "$(git status --porcelain $alvos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $alvos
            git commit -m "Mede (auto)"
            git pull --rebase --autostash origin main
            git push
          fi
